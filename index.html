<!--
  The site's front door.

  Every page in this project is a FOLDER — /peers/, /timeline/, /churn/ — and the hub that
  links them is one of them, at /index/. That is deliberate: the repository is the site, so
  a page is a directory you can read, and the hub gets no special treatment.

  The cost is that the repository ROOT has no page of its own, which is the one URL people
  actually type. This file is that page. It is a redirect rather than a copy of the hub,
  because two hubs is one hub too many and the second one always goes stale.
-->
<meta http-equiv="refresh" content="0; url=index/">
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #FBF9F4; color: #23201B;
    font: 16px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  }
  main { max-width: 34rem; padding: 2rem; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 .6rem; letter-spacing: -0.012em; }
  p { margin: 0 0 1rem; color: #5A544A; }
  a { color: #0C6473; }
</style>
</head>
