# Verify on every push and pull request; deploy to GitHub Pages only from main.
#
# The repo IS the site: each artifact folder serves as a page (index.html + app.js +
# data/), sharing _shared/ and _data/SOURCES.json exactly as they do in development.
# What you can read in the repo is what a visitor runs — that is the point of publishing.
#
# The gates use the same runner as local release (METHODS-SOP §7). They run on
# pull requests too, so a contributor sees the failure before a maintainer does. dist/ is
# not committed — a committed dist was a standing leak vector — so bundles are rebuilt
# here for exactly what is in the repo, then gated, then uploaded.

name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The width sweeps are minutes rather than seconds, so they run weekly instead of on
  # every push. Monday morning, before anyone would present from this.
  schedule:
    - cron: "0 11 * * 1"

# Least privilege by default; the deploy job raises what it needs.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `npm ci` installs playwright as a devDependency; the postinstall fetches the
      # chromium binary. --with-deps adds the Linux libraries chromium needs to launch.
      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # The fast run skips the two width sweeps and gate self-tests. Source regression
      # tests are included. The runner rebuilds dist/ first and retains each gate's full
      # output outside the site tree; a summarized console line is not the whole receipt.
      #
      # --fast prints "A --fast pass is not a clean bill" in its own verdict, and it is
      # right: the sweeps are the checks that found sub-12px text on 14 of 16 pages and
      # ~50 collisions. They run in the `full` job below rather than not at all.
      - name: Gates (fast subset)
        run: node tools/all.mjs --fast "--log-dir=${{ runner.temp }}/evidence-room-gates"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-gate-results
          path: ${{ runner.temp }}/evidence-room-gates
      # The site is uploaded from this same checkout so deploy cannot ship anything
      # verify did not see. dist/ rides along; the pages themselves are the folders.
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: .

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # THE SLOW HALF, ON A SCHEDULE. The two 14-width sweeps plus the selftest that proves
  # each gate still fails its own known defect. Never gated a push before; running them
  # weekly is the difference between a check that exists and a check that runs.
  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Full suite
        run: node tools/all.mjs "--log-dir=${{ runner.temp }}/evidence-room-gates"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-gate-results
          path: ${{ runner.temp }}/evidence-room-gates
