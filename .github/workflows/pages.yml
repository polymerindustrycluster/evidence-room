# Verify and deploy. Verify runs on every push and pull request; deploy only from main.
#
# The repo IS the site: each artifact folder serves as a page (index.html + app.js +
# data/), sharing _shared/ and _data/SOURCES.json exactly as they do in development.
# What you can read in the repo is what a visitor runs — that is the point of publishing.
#
# The gates use the same runner as local release (METHODS-SOP §7). They run on
# pull requests too, so a contributor sees the failure before a maintainer does. dist/ is
# not committed — a committed dist was a standing leak vector — so bundles are rebuilt
# here for exactly what is in the repo, then gated, then uploaded.
#
# THE SUITE RUNS AS PARALLEL SLICES of one command (tools/all.mjs --part / --shard): the
# site-wide gates, the page gates split into page shards, and the gate self-tests. Each
# slice is one job; `verify` is the aggregate, the one check a branch rule should require,
# and the only job deploy depends on. A slice's own "SUITE PASSED" covers that slice only.
#
# What each event runs:
#   pull_request   --fast, page gates scoped to the pages the PR changed (--changed against
#                  its base; anything shared puts every page back), self-tests for the gates
#                  and fixtures the PR touched.
#   push to main   --fast on every page, as before.
#   schedule and   the full suite: both 14-width sweeps and every self-test, every page.
#   dispatch

name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The width sweeps are minutes rather than seconds, so they run weekly instead of on
  # every push. Monday morning, before anyone would present from this.
  schedule:
    - cron: "0 11 * * 1"

# Least privilege by default; the deploy job raises what it needs.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Decides what this event runs, once, so every slice runs the same suite.
  plan:
    runs-on: ubuntu-latest
    outputs:
      args: ${{ steps.mode.outputs.args }}
      selftest: ${{ steps.mode.outputs.selftest }}
    steps:
      - id: mode
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "$EVENT" in
            pull_request) args="--fast --changed=origin/$BASE_REF"; selftest=true ;;
            push)         args="--fast";                            selftest=false ;;
            *)            args="";                                  selftest=true ;;
          esac
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "selftest=$selftest" >> "$GITHUB_OUTPUT"
          echo "suite arguments: ${args:-(full suite)}; self-tests: $selftest"

  gates:
    needs: plan
    name: gates (${{ matrix.part }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: site
          - {part: pages, shard: 1/3}
          - {part: pages, shard: 2/3}
          - {part: pages, shard: 3/3}
          - part: selftest
    runs-on: ubuntu-latest
    steps:
      # Full history: _data/build/stamp_cite.py dates each page from git, and a shallow clone
      # would date every page to the one commit it can see. --changed also needs the base
      # branch, which a full fetch brings.
      - uses: actions/checkout@v4
        if: matrix.part != 'selftest' || needs.plan.outputs.selftest == 'true'
        with:
          fetch-depth: 0   # verify_consistency reads headline dates from git history
      - uses: actions/setup-node@v4
        if: matrix.part != 'selftest' || needs.plan.outputs.selftest == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        if: matrix.part != 'selftest' || needs.plan.outputs.selftest == 'true'
        with:
          python-version: "3.12"
      # `npm ci` installs playwright as a devDependency; the postinstall fetches the
      # chromium binary. --with-deps adds the Linux libraries chromium needs to launch.
      - name: Install
        if: matrix.part != 'selftest' || needs.plan.outputs.selftest == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # The runner rebuilds dist/ first and retains each gate's full output outside the site
      # tree; a summarized console line is not the whole receipt. --fast prints "A --fast
      # pass is not a clean bill" in its own verdict, and it is right: the sweeps are the
      # checks that found sub-12px text on 14 of 16 pages and ~50 collisions. They run on
      # the schedule below rather than not at all.
      - name: Gates
        if: matrix.part != 'selftest' || needs.plan.outputs.selftest == 'true'
        env:
          ARGS: ${{ needs.plan.outputs.args }}
          PART: ${{ matrix.part }}
          SHARD: ${{ matrix.shard }}
        run: |
          # shellcheck disable=SC2086  # ARGS is a list of flags, split on purpose
          node tools/all.mjs $ARGS "--part=$PART" ${SHARD:+"--shard=$SHARD"} \
            "--log-dir=${{ runner.temp }}/evidence-room-gates"
      - name: Self-tests not run
        if: matrix.part == 'selftest' && needs.plan.outputs.selftest != 'true'
        run: echo "Self-tests do not run on a push to main (they ran on the pull request and run weekly)."
      - uses: actions/upload-artifact@v4
        if: always() && (matrix.part != 'selftest' || needs.plan.outputs.selftest == 'true')
        with:
          name: gate-results-${{ matrix.part }}${{ matrix.shard && format('-{0}', strategy.job-index) || '' }}
          path: ${{ runner.temp }}/evidence-room-gates

  # THE AGGREGATE. Passes only if every slice passed; this is the check to require and
  # the job deploy waits on. On main it also builds the Pages upload, from a fresh checkout
  # of the same commit, so deploy cannot ship anything the slices did not see.
  verify:
    needs: [plan, gates]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every slice passed
        env:
          PLAN: ${{ needs.plan.result }}
          GATES: ${{ needs.gates.result }}
        run: |
          echo "plan: $PLAN; gates: $GATES"
          [ "$PLAN" = success ] && [ "$GATES" = success ] || { echo "::error::a gate slice did not pass"; exit 1; }
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
        with:
          fetch-depth: 0   # stamp_cite.py dates each page from git history
      - uses: actions/setup-node@v4
        if: github.event_name != 'pull_request'
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        if: github.event_name != 'pull_request'
        with:
          python-version: "3.12"
      # The site is uploaded from this checkout. dist/ rides along; the pages themselves are
      # the folders. bundle.mjs needs no packages. The citation record is generated, not
      # committed: re-stamp it from git right before the upload, so the deployed dates are
      # this commit's.
      - name: Bundle and stamp page revision dates
        if: github.event_name != 'pull_request'
        run: |
          node tools/bundle.mjs
          python3 _data/build/stamp_cite.py
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: .

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
